<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="mr-title mr-desc">
  <title id="mr-title">The room we grew up in.</title>
  <desc id="mr-desc">A hand-illustrated childhood sitting room: a window with afternoon light, a sofa across the room, a mustard armchair beside a floor lamp, and a game controller on the rug.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8d9bc"/>
      <stop offset="1" stop-color="#d9c4a0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b78a5a"/>
      <stop offset="1" stop-color="#96683c"/>
    </linearGradient>
    <linearGradient id="sunbeam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe9b0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffe9b0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="chair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8a437"/>
      <stop offset="1" stop-color="#b3831f"/>
    </linearGradient>
    <linearGradient id="sofaG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7e9a86"/>
      <stop offset="1" stop-color="#5f7a66"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.25  0 0 0 0 0.15  0 0 0 0.05 0"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#5a4326" stroke-width="0.8" opacity="0.25"/>
    </pattern>
  </defs>

  <!-- postcard mat -->
  <rect width="1200" height="800" fill="#f3e9d4"/>
  <rect x="18" y="18" width="1164" height="700" fill="#e9dcc0" stroke="#8a6f4d" stroke-width="2"/>

  <g filter="url(#grain)" stroke="#4a3823" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- back wall and floor -->
    <rect x="40" y="40" width="1120" height="430" fill="url(#wall)"/>
    <path d="M40 470 L1160 470 L1160 700 L40 700 Z" fill="url(#floor)"/>
    <!-- floorboards -->
    <g stroke="#7a5732" stroke-width="1.6" opacity="0.7">
      <line x1="40" y1="520" x2="1160" y2="520"/>
      <line x1="40" y1="575" x2="1160" y2="575"/>
      <line x1="40" y1="635" x2="1160" y2="635"/>
      <line x1="250" y1="470" x2="225" y2="700"/>
      <line x1="520" y1="470" x2="505" y2="700"/>
      <line x1="790" y1="470" x2="795" y2="700"/>
      <line x1="1040" y1="470" x2="1070" y2="700"/>
    </g>
    <!-- skirting -->
    <rect x="40" y="452" width="1120" height="18" fill="#efe3c8" stroke-width="2"/>

    <!-- window, top left, with curtains -->
    <g>
      <rect x="90" y="80" width="220" height="240" fill="#cfe0e4"/>
      <line x1="200" y1="80" x2="200" y2="320"/>
      <line x1="90" y1="200" x2="310" y2="200"/>
      <rect x="80" y="70" width="240" height="14" rx="6" fill="#6b4f2f"/>
      <path d="M80 84 Q100 200 84 330 L120 330 Q132 210 118 84 Z" fill="#a8543a"/>
      <path d="M320 84 Q300 200 316 330 L282 330 Q270 210 284 84 Z" fill="#a8543a"/>
      <rect x="90" y="320" width="220" height="12" fill="#efe3c8"/>
      <!-- sun -->
      <circle cx="140" cy="130" r="26" fill="#f2c14e" stroke="none"/>
    </g>
    <!-- light shafts -->
    <path d="M140 330 L420 700 L300 700 L110 330 Z" fill="url(#sunbeam)" stroke="none"/>
    <path d="M250 330 L640 700 L540 700 L210 330 Z" fill="url(#sunbeam)" stroke="none" opacity="0.7"/>
    <!-- dust motes -->
    <g fill="#f7ecd2" stroke="none">
      <circle cx="240" cy="430" r="3"/>
      <circle cx="330" cy="510" r="2.4"/>
      <circle cx="290" cy="590" r="2.8"/>
      <circle cx="430" cy="560" r="2.2"/>
    </g>

    <!-- framed family photos on wall -->
    <g>
      <rect x="420" y="110" width="110" height="90" fill="#f6efdd"/>
      <rect x="430" y="120" width="90" height="70" fill="#9db4ab"/>
      <circle cx="465" cy="150" r="12" fill="#f2c14e" stroke="none"/>
      <path d="M430 190 L465 158 L492 178 L520 150 L520 190 Z" fill="#6b8a74" stroke="none"/>
      <rect x="580" y="130" width="80" height="64" fill="#f6efdd"/>
      <rect x="588" y="138" width="64" height="48" fill="#b98d5f"/>
      <circle cx="612" cy="156" r="9" fill="#f2e4c8" stroke="none"/>
      <circle cx="632" cy="160" r="8" fill="#f2e4c8" stroke="none"/>
      <!-- wonky frame -->
      <g transform="rotate(-4 720 150)">
        <rect x="685" y="120" width="70" height="58" fill="#f6efdd"/>
        <rect x="692" y="127" width="56" height="44" fill="#8a9bb0"/>
      </g>
    </g>

    <!-- bookshelf mid-right of window -->
    <g>
      <rect x="370" y="240" width="140" height="212" fill="#7a5732"/>
      <rect x="380" y="252" width="120" height="56" fill="#5f4326"/>
      <rect x="380" y="320" width="120" height="56" fill="#5f4326"/>
      <rect x="380" y="388" width="120" height="54" fill="#5f4326"/>
      <!-- books -->
      <g stroke-width="1.5">
        <rect x="385" y="258" width="14" height="50" fill="#a8543a"/>
        <rect x="401" y="264" width="12" height="44" fill="#7e9a86"/>
        <rect x="415" y="256" width="16" height="52" fill="#d8a437"/>
        <rect x="433" y="268" width="11" height="40" fill="#8a9bb0"/>
        <rect x="446" y="260" width="14" height="48" fill="#b35a78"/>
        <rect x="385" y="330" width="15" height="46" fill="#6b8a74"/>
        <rect x="402" y="336" width="12" height="40" fill="#c97f3d"/>
        <rect x="416" y="328" width="13" height="48" fill="#8a6f9b"/>
        <rect x="431" y="340" width="30" height="10" fill="#a8543a"/>
        <rect x="431" y="352" width="30" height="10" fill="#7e9a86"/>
        <rect x="431" y="364" width="30" height="10" fill="#d8a437"/>
        <!-- game cartridges on bottom shelf -->
        <rect x="385" y="402" width="26" height="34" fill="#3d4a5c"/>
        <rect x="415" y="402" width="26" height="34" fill="#5c3d4a"/>
        <rect x="445" y="402" width="26" height="34" fill="#3d5c4a"/>
      </g>
    </g>

    <!-- rug -->
    <g>
      <path d="M180 560 L760 548 L860 690 L120 690 Z" fill="#a8543a"/>
      <path d="M210 575 L740 565 L820 675 L155 675 Z" fill="#c97f3d" fill-opacity="0.85"/>
      <path d="M250 590 L715 582 L775 660 L195 660 Z" fill="#a8543a" fill-opacity="0.6"/>
      <g stroke="#e9dcc0" stroke-width="2" fill="none" opacity="0.8">
        <path d="M300 605 L380 600 L420 640 L340 648 Z"/>
        <path d="M500 596 L580 592 L625 635 L545 642 Z"/>
      </g>
      <path d="M120 690 L860 690 L870 700 L110 700 Z" fill="#7c3b27"/>
      <!-- tassels -->
      <g stroke="#e9dcc0" stroke-width="2">
        <line x1="130" y1="692" x2="126" y2="700"/>
        <line x1="160" y1="691" x2="157" y2="700"/>
        <line x1="820" y1="691" x2="827" y2="700"/>
        <line x1="850" y1="690" x2="858" y2="700"/>
      </g>
    </g>

    <!-- sofa across the room, left-centre against wall -->
    <g>
      <rect x="150" y="330" width="270" height="130" rx="16" fill="url(#sofaG)"/>
      <rect x="135" y="390" width="45" height="110" rx="14" fill="#5f7a66"/>
      <rect x="390" y="390" width="45" height="110" rx="14" fill="#5f7a66"/>
      <rect x="170" y="392" width="105" height="58" rx="10" fill="#8fae97"/>
      <rect x="285" y="392" width="105" height="58" rx="10" fill="#8fae97"/>
      <!-- sagging cushion lines -->
      <path d="M180 430 Q227 442 270 430" fill="none" stroke-width="2"/>
      <path d="M295 430 Q342 442 385 430" fill="none" stroke-width="2"/>
      <!-- throw blanket -->
      <path d="M150 340 Q190 355 185 395 L150 405 Z" fill="#d8a437"/>
      <path d="M150 355 Q175 368 172 398" fill="none" stroke="#8a6f4d" stroke-width="1.5"/>
      <!-- legs -->
      <rect x="165" y="500" width="14" height="26" fill="#5a4326"/>
      <rect x="400" y="500" width="14" height="26" fill="#5a4326"/>
      <!-- cushion shadow -->
      <rect x="150" y="452" width="270" height="10" fill="#4d6353" stroke="none" opacity="0.5"/>
    </g>

    <!-- side table with mug -->
    <g>
      <rect x="470" y="420" width="80" height="14" rx="4" fill="#7a5732"/>
      <rect x="482" y="434" width="10" height="66" fill="#5a4326"/>
      <rect x="528" y="434" width="10" height="66" fill="#5a4326"/>
      <path d="M492 400 L512 400 L510 420 L494 420 Z" fill="#b35a78"/>
      <path d="M512 405 Q522 407 518 415 Q514 420 510 416" fill="none" stroke-width="2"/>
    </g>

    <!-- potted plant far left -->
    <g>
      <path d="M60 460 Q40 420 55 380 Q70 420 60 460" fill="#6b8a74"/>
      <path d="M68 462 Q60 410 85 375 Q90 425 74 462" fill="#7e9a86"/>
      <path d="M76 462 Q85 430 110 420 Q95 455 80 464" fill="#6b8a74"/>
      <path d="M52 462 L88 462 L82 502 L58 502 Z" fill="#a8543a"/>
    </g>

    <!-- floor lamp, right of centre -->
    <g>
      <ellipse cx="880" cy="540" rx="34" ry="10" fill="#5a4326"/>
      <line x1="880" y1="300" x2="880" y2="540" stroke-width="6"/>
      <path d="M845 300 L915 300 L898 232 L862 232 Z" fill="#f2d488"/>
      <path d="M845 300 L915 300" fill="none"/>
      <!-- warm glow -->
      <ellipse cx="880" cy="330" rx="90" ry="70" fill="#f2c14e" opacity="0.18" stroke="none"/>
      <ellipse cx="880" cy="560" rx="120" ry="26" fill="#f2c14e" opacity="0.14" stroke="none"/>
      <!-- pull cord -->
      <line x1="905" y1="300" x2="905" y2="330" stroke-width="1.6"/>
      <circle cx="905" cy="334" r="3.5" fill="#e9dcc0"/>
    </g>

    <!-- mustard armchair, right foreground -->
    <g>
      <rect x="960" y="380" width="180" height="150" rx="18" fill="url(#chair)"/>
      <rect x="935" y="440" width="50" height="120" rx="16" fill="#b3831f"/>
      <rect x="1115" y="440" width="50" height="120" rx="16" fill="#b3831f"/>
      <rect x="980" y="470" width="140" height="60" rx="12" fill="#e0ae45"/>
      <!-- cushion seams -->
      <path d="M985 500 Q1050 514 1115 500" fill="none" stroke="#8a6f4d" stroke-width="2"/>
      <path d="M1050 470 L1050 530" fill="none" stroke="#8a6f4d" stroke-width="1.5" opacity="0.6"/>
      <!-- buttons on back -->
      <circle cx="1010" cy="420" r="4" fill="#8a6f4d"/>
      <circle cx="1050" cy="415" r="4" fill="#8a6f4d"/>
      <circle cx="1090" cy="420" r="4" fill="#8a6f4d"/>
      <!-- wooden feet -->
      <path d="M970 560 L962 588 L974 588 L980 560 Z" fill="#5a4326"/>
      <path d="M1130 560 L1138 588 L1126 588 L1120 560 Z" fill="#5a4326"/>
      <!-- shadow under chair -->
      <ellipse cx="1050" cy="592" rx="110" ry="12" fill="#4a3018" opacity="0.35" stroke="none"/>
    </g>

    <!-- game controller on the rug -->
    <g transform="rotate(-8 560 570)">
      <path d="M528 560 Q528 548 542 548 L578 548 Q592 548 592 560 L596 580 Q598 592 586 590 Q576 588 572 578 L548 578 Q544 588 534 590 Q522 592 524 580 Z" fill="#3d4a5c"/>
      <circle cx="578" cy="560" r="4" fill="#e9dcc0"/>
      <circle cx="568" cy="566" r="4" fill="#c05f2e"/>
      <rect x="540" y="556" width="14" height="5" fill="#e9dcc0"/>
      <rect x="544.5" y="551.5" width="5" height="14" fill="#e9dcc0"/>
      <!-- cable trailing away -->
      <path d="M560 548 Q560 520 590 512 T660 500" fill="none" stroke="#3d4a5c" stroke-width="2.5"/>
    </g>

    <!-- wall hatch texture touches -->
    <rect x="40" y="40" width="1120" height="430" fill="url(#hatch)" stroke="none" opacity="0.35"/>
  </g>

  <!-- postcard caption strip -->
  <line x1="18" y1="718" x2="1182" y2="718" stroke="#8a6f4d" stroke-width="1.5"/>
  <text x="600" y="762" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-style="italic" font-size="34" fill="#4a3823">The room we grew up in.</text>
  <text x="600" y="782" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="11" letter-spacing="3" fill="#8a6f4d">ENIGMAGIFT · A MEMORY HUNT</text>
</svg>
