app = "enigmagift-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  # Persistent volume mounted at /data (see [[mounts]] below)
  DB_PATH = "/data/enigmagift.db"
  UPLOADS_DIR = "/data/uploads"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[[mounts]]
  source = "data"
  destination = "/data"
